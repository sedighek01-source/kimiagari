name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p www/fonts assets
          if [ -f index.html ]; then mv index.html www/index.html; fi
          mv -f ./*.woff2 www/fonts/ 2>/dev/null || true
          mv -f icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/ 2>/dev/null || true
          ls -R www assets

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kimiagari-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
